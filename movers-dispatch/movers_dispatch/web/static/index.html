<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Movers Emails</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span> Dispatch Movers Emails <small>Worked By depuis l'Owner du Case</small></div>
  <button id="stop" class="danger" type="button" title="Arrêt immédiat : aucune écriture après ce clic">■ Arrêt immédiat</button>
</header>
<div id="banner" class="banner"></div>
<main>
  <section class="card controls">
    <fieldset id="modes">
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="simulation" checked> <b>Simulation</b> <span>lecture seule, propose sans rien écrire</span></label>
      <label><input type="radio" name="mode" value="supervise"> <b>Supervisé</b> <span>chaque affectation attend votre validation</span></label>
      <label id="auto-label"><input type="radio" name="mode" value="automatique"> <b>Automatique</b> <span>cas non ambigus uniquement</span></label>
    </fieldset>
    <div id="auto-confirm" hidden>
      <label>Pour activer le mode Automatique, saisir <code>AUTOMATIQUE</code> :
        <input id="confirmation" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="run-row">
      <button id="run" type="button" class="primary">Lancer le traitement</button>
      <span id="runstate" class="muted" aria-live="polite"></span>
    </div>
  </section>

  <section class="counters" aria-label="Compteurs">
    <div><b id="c-detectes">0</b><span>détectés</span></div>
    <div><b id="c-traites">0</b><span>traités</span></div>
    <div><b id="c-affectes">0</b><span>affectations</span></div>
    <div><b id="c-ignores">0</b><span>ignorés (déjà traités)</span></div>
    <div class="warn"><b id="c-validation">0</b><span>à valider</span></div>
    <div class="err"><b id="c-erreurs">0</b><span>erreurs</span></div>
  </section>

  <section class="card">
    <div class="head"><h2>Mails de la file</h2>
      <select id="filter" aria-label="Filtrer par statut">
        <option value="">Tous les statuts</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Élément</th><th>Sujet</th><th>Compte</th><th>Case</th><th>Owner</th><th>Worked By</th><th>Statut</th><th>Motif</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="9" class="muted">Aucun élément : lancer un traitement (Simulation par défaut).</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Historique</h2>
    <ol id="events" class="events"></ol>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
