[project]
name = "movers-dispatch"
version = "0.1.0"
description = "Agent de dispatch de la file Movers Emails (Dynamics 365) : Worked By depuis l'Owner du Case (outil interne)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "tzdata; sys_platform == 'win32'",   # fuseaux horaires (Windows n'en fournit pas à Python)
]

[project.optional-dependencies]
# Connexion « msal » : application Entra ID enregistrée et approuvée par l'IT (jeton délégué).
msal = ["msal>=1.28"]
# Connexion « browser » : session Dynamics 365 ouverte par l'utilisateur dans un navigateur piloté.
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
movers-dispatch = "movers_dispatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["movers_dispatch*"]

[tool.setuptools.package-data]
movers_dispatch = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
