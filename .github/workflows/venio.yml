# Venio : tests backend sur PostgreSQL 16 réel, typage et build du frontend, build des images Docker.
name: Venio — tests

on:
  push:
    paths: ["venio/**", ".github/workflows/venio.yml"]
  pull_request:
    paths: ["venio/**", ".github/workflows/venio.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: venio/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VENIO_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check venio tests --select F,E9
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: venio/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: venio/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build de la démonstration statique (GitHub Pages)
        run: rm -rf .next && npm run build
        env:
          NEXT_PUBLIC_VENIO_DEMO: "1"
          NEXT_PUBLIC_BASE_PATH: /SA-IA/venio

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t venio-api venio/backend
      - run: docker build -t venio-web venio/web
