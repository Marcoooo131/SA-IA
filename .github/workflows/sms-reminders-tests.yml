# Tests of the SMS reminder application (Python), on SQLite and PostgreSQL.
name: SMS Reminders — tests

on:
  push:
    paths: ["sms-reminders/**", ".github/workflows/sms-reminders-tests.yml"]
  pull_request:
    paths: ["sms-reminders/**", ".github/workflows/sms-reminders-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-reminders
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: python -m pytest
      - name: Tests (PostgreSQL)
        run: python -m pytest
        env:
          SMR_TEST_DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_test
