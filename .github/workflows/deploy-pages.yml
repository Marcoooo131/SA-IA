# Publie l'application sur GitHub Pages à chaque mise à jour.
# Prérequis (une fois) : Settings > Pages > Source = « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # « Améliorateur Phone Call » (…/ameliorateur/) : the formatter of phonecall-desktop run in the
      # browser by Pyodide, hosted here (no third-party site; the transcript never leaves the page)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the Améliorateur Phone Call page
        run: |
          pip install pyyaml
          curl -fsSL -o /tmp/pyodide.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-core-0.26.4.tar.bz2
          echo "70dba93432f3653155998cc9001f9c200182343c2f95165a2f9e9e4673fa35e8  /tmp/pyodide.tar.bz2" | sha256sum -c -
          mkdir -p /tmp/pyodide-core && tar -xjf /tmp/pyodide.tar.bz2 -C /tmp/pyodide-core
          python phonecall-desktop/scripts/build_web_ameliorateur.py dist/ameliorateur --pyodide /tmp/pyodide-core/pyodide
      # Présentation équipe « Nouvelle organisation Movers » (…/presentation-movers/)
      - name: Build the Movers team presentation
        working-directory: movers-presentation
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/presentation-movers
          cp -r dist/. ../dist/presentation-movers/
      # Agenda partagé (…/agenda/) : l'adresse et la clé PUBLIQUE du projet Supabase sont dans
      # agenda-partage/.env.production (aucun secret dans ce fichier).
      - name: Build de l'agenda partagé
        working-directory: agenda-partage
        run: |
          npm ci
          npm test
          npm run build
          mkdir -p ../dist/agenda && cp -r dist/. ../dist/agenda/
      # Rappels de l'équipe Movers (…/rappels/) : page statique, sans aucune donnée (elle lit sur le PC de
      # l'agent le fichier écrit par l'agent Dispatch dans le dossier Teams)
      - name: Page des rappels de l'équipe
        run: mkdir -p dist/rappels && cp rappels-equipe/index.html dist/rappels/index.html
      # Calculette NID / LID (…/nid/) : page statique, calcul 100 % local
      - name: Calculette NID / LID
        run: mkdir -p dist/nid && cp calculette-nid/index.html dist/nid/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
