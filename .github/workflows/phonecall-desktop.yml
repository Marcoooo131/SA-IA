# Poste conseiller (phonecall-desktop) : tests Linux + interface, benchmark de transcription
# réelle (voix de synthèse), et vérifications sous Windows (WASAPI, paquet .exe).
name: Phone Call Desktop

on:
  push:
    paths: ["phonecall-desktop/**", "phonecall-agent/**", ".github/workflows/phonecall-desktop.yml"]
  pull_request:
    paths: ["phonecall-desktop/**", "phonecall-agent/**", ".github/workflows/phonecall-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: phonecall-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -e ../phonecall-agent
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest

  stt-benchmark:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: phonecall-desktop } }
    strategy:
      fail-fast: false
      matrix:
        model: [base, small, medium]
        voice: [espeak, piper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install -e . piper-tts
      - run: python scripts/benchmark_stt.py --model ${{ matrix.model }} --voice ${{ matrix.voice }} --out stt_benchmark_${{ matrix.model }}_${{ matrix.voice }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: stt-benchmark-${{ matrix.model }}-${{ matrix.voice }}
          path: phonecall-desktop/stt_benchmark_${{ matrix.model }}_${{ matrix.voice }}.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: phonecall-desktop, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,build]" -e ../phonecall-agent
      - name: Unit and integration tests (Windows)
        run: python -m pytest
        env: { PCD_SKIP_UI_TESTS: "1" }
      - name: WASAPI device enumeration (runners usually have no audio device)
        run: python -m phonecall_desktop.diag; exit 0
      - name: Self-test with the WASAPI backend
        run: python -m phonecall_desktop --selftest
        env: { PCD_ENVIRONMENT: dev, PCD_AUDIO_BACKEND: wasapi, PCD_NOTES_CLIENT: simulated }
      - name: Build the Windows package
        run: ./packaging/build_windows.ps1
      - name: Checks of the packaged application (as delivered, with its config.env)
        working-directory: phonecall-desktop/dist/PhoneCallDesktop
        run: |
          function Run-App($argList, $timeoutMs) {
            $p = Start-Process ./PhoneCallDesktop.exe -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit($timeoutMs)) { $p.Kill(); Write-Host "TIMEOUT: $argList"; exit 1 }
            return $p.ExitCode
          }
          $code = Run-App '--selftest --report selftest.txt' 120000
          Get-Content selftest.txt; Write-Host "selftest exit code: $code"; if ($code -ne 0) { exit $code }
          # Delivered profile: production, note without AI using business.yaml, bundled transcription model
          if (-not (Select-String -Path selftest.txt -Pattern "environment: production" -Quiet)) { Write-Host "packaged profile is not production"; exit 1 }
          if (-not (Select-String -Path selftest.txt -Pattern "note engine ok: mode=sans IA.*template=2026.*categories=[1-9]" -Quiet)) { Write-Host "note engine or template missing"; exit 1 }
          if (-not (Select-String -Path selftest.txt -Pattern "transcription model: .*models.small \(offline=True\)" -Quiet)) { Write-Host "bundled model not used"; exit 1 }
          # Claude option still bundled (SDK, versioned prompt, schema): checked without any API call
          $env:PCD_NOTES_CLIENT = 'anthropic'
          $code = Run-App '--selftest --report selftest-claude.txt' 120000
          Remove-Item Env:PCD_NOTES_CLIENT
          Get-Content selftest-claude.txt
          if ($code -ne 0 -or -not (Select-String -Path selftest-claude.txt -Pattern "note engine ok: model=claude.*categories=[1-9]" -Quiet)) { Write-Host "Claude option broken"; exit 1 }
          $code = Run-App '--diag 0 --report diag.txt' 60000
          Get-Content diag.txt; Write-Host "diag exit code: $code (1 = no audio device on CI runners)"
          # Bundled model loaded with Hugging Face unreachable (as on a PC where it is blocked)
          $env:HF_HUB_OFFLINE = '1'; $env:HF_ENDPOINT = 'http://127.0.0.1:9'
          $code = Run-App '--selftest-recognizer small --report recognizer.txt' 600000
          Remove-Item Env:HF_HUB_OFFLINE, Env:HF_ENDPOINT
          Get-Content recognizer.txt; Write-Host "recognizer exit code: $code"; if ($code -ne 0) { exit $code }
          if (-not (Select-String -Path recognizer.txt -Pattern "offline=True" -Quiet)) { Write-Host "model was not loaded from the package"; exit 1 }
          $code = Run-App '--smoke-window 3' 180000
          Write-Host "WebView2 window exit code: $code (0 = page loaded in the native window)"
          if ($code -ne 0) { Get-Content "$env:LOCALAPPDATA\PhoneCallDesktop\logs\phonecall-desktop.log" -Tail 30; exit $code }
          Remove-Item selftest.txt, selftest-claude.txt, diag.txt, recognizer.txt
      - name: Re-create the zip without test outputs
        run: Compress-Archive -Path dist\PhoneCallDesktop -DestinationPath dist\PhoneCallDesktop-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCallDesktop-windows-zip
          path: phonecall-desktop/dist/PhoneCallDesktop-windows.zip
          retention-days: 7

  release:
    # Publishes the tested Windows package as a GitHub Release (permanent download link).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [windows, tests-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: PhoneCallDesktop-windows-zip }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Phone Call Desktop 0.1.${{ github.run_number }} (version de test)
          prerelease: true
          make_latest: true
          files: PhoneCallDesktop-windows.zip
          body: |
            Poste conseiller Phone Call (application Windows non signée).
            Transcription en direct calculée sur le PC avec le modèle livré dans le zip (aucun accès à Hugging Face).
            À la fin de l'appel : compte rendu dans la **template générale Phone Call** (8 rubriques, champs Movers / Frontline / Appel sortant), rempli **sans IA** (aucun coût, rien n'est envoyé sur Internet).

            1. Téléchargez `PhoneCallDesktop-windows.zip`, clic droit › Extraire tout.
            2. Ouvrez le dossier `PhoneCallDesktop` et lisez `LISEZMOI.txt`.
            3. Double-cliquez sur `PhoneCallDesktop.exe` (si Windows le bloque : « Informations complémentaires » › « Exécuter quand même »).
            4. Autorisez le micro : Paramètres › Confidentialité et sécurité › Microphone › « Autoriser les applications de bureau ».

            Option (payante) : note rédigée par Claude — voir la section 6 de `LISEZMOI.txt`.

            Commit : ${{ github.sha }}
