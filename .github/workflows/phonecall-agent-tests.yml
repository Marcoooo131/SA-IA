# Tests of the Phone Call agent (Python), on SQLite and PostgreSQL, with Redis.
name: Phone Call Agent — tests

on:
  push:
    paths: ["phonecall-agent/**", ".github/workflows/phonecall-agent-tests.yml"]
  pull_request:
    paths: ["phonecall-agent/**", ".github/workflows/phonecall-agent-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phonecall-agent
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phonecall
          POSTGRES_PASSWORD: phonecall
          POSTGRES_DB: phonecall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phonecall" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: python -m pytest
      - name: Tests (PostgreSQL)
        run: python -m pytest
        env:
          PCA_TEST_DATABASE_URL: postgresql+psycopg://phonecall:phonecall@localhost:5432/phonecall_test
      - name: End-to-end demo on synthetic data
        run: python -m phonecall_agent.cli demo
