# BODYTRACK : sécurité de la base (RLS), tests unitaires des calculs et build de production.
name: BODYTRACK — tests

on:
  push:
    paths: ["bodytrack/**", ".github/workflows/bodytrack.yml"]
  pull_request:
    paths: ["bodytrack/**", ".github/workflows/bodytrack.yml"]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bodytrack
    steps:
      - uses: actions/checkout@v4
      - name: Migration + tests de sécurité (RLS, stockage privé, suppression de compte)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test-db.sh

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bodytrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bodytrack/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
