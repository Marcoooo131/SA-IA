# Agenda partagé : sécurité de la base (PostgreSQL), tests unitaires, build et tests d'interface.
name: Agenda partagé — tests

on:
  push:
    paths: ["agenda-partage/**", ".github/workflows/agenda-partage.yml"]
  pull_request:
    paths: ["agenda-partage/**", ".github/workflows/agenda-partage.yml"]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: agenda-partage
    steps:
      - uses: actions/checkout@v4
      - name: Migration + tests de sécurité (RLS, rôles, confidentialité)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test-db.sh

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-partage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agenda-partage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
