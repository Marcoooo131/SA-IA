# Tests of the Movers Emails dispatch agent (Python), on fictitious data only.
name: Movers Dispatch (version Azure) — tests

on:
  push:
    paths: ["movers-dispatch-azure/**", ".github/workflows/movers-dispatch-azure-tests.yml"]
  pull_request:
    paths: ["movers-dispatch-azure/**", ".github/workflows/movers-dispatch-azure-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movers-dispatch-azure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[browser,msal,dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest
