# Netlify — interface Venio (offre gratuite). Dossier de base du site : venio/web
# Variable d'environnement à définir dans Netlify : VENIO_API_URL = https://<api>.onrender.com
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

# Adaptateur Next.js (pages serveur, réécriture /api vers Render).
# Obligatoire quand le projet Netlify n'a pas été créé depuis l'interface.
[[plugins]]
  package = "@netlify/plugin-nextjs"
