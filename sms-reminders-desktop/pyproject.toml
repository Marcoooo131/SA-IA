[project]
name = "sms-reminders-desktop"
version = "0.1.0"
description = "Relances SMS Movers & Takeovers — application de bureau Windows (poste unique)."
requires-python = ">=3.11"
dependencies = [
  "sms-reminders",  # ../sms-reminders (pip install -e ../sms-reminders)
  "httpx>=0.27",
  "pywebview>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[project.scripts]
relances-sms = "sms_desktop.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sms_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
