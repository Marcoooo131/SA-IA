[project]
name = "phonecall-agent"
version = "0.1.0"
description = "Prototype : génération automatique des Phone Call à partir des enregistrements Twilio (Sector Alarm)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "cryptography>=42",
  "pyyaml>=6",
  "redis>=5",
  "rq>=1.16",
  "twilio>=9",
  "anthropic>=1.13",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phonecall_agent*"]

[tool.setuptools.package-data]
phonecall_agent = ["web/templates/*.html", "web/static/*", "demo_data/*/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
