[project]
name = "assistant-movers"
version = "0.1.0"
description = "Assistant local (sans IA) pour les dossiers Movers Moving Out dans le CRM Sector Alarm : case, WO, rendez-vous, SMS, email."
requires-python = ">=3.11"
# Mêmes composants que movers-dispatch : rien de nouveau à faire valider par l'IT.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
assistant-movers = "assistant_movers.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assistant_movers*"]

[tool.setuptools.package-data]
assistant_movers = ["web/static/*", "demo.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
