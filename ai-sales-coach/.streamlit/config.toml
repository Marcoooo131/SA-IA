[theme]
base = "dark"
primaryColor = "#E10600"
backgroundColor = "#0B0B0B"
secondaryBackgroundColor = "#171717"
textColor = "#F5F5F5"
font = "sans serif"

[server]
headless = true
maxUploadSize = 200
enableXsrfProtection = true
# Certains antivirus / proxys d'entreprise bloquent les WebSockets compressés (page noire).
enableWebsocketCompression = false
address = "127.0.0.1"
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
