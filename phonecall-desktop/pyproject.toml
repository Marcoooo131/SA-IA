[project]
name = "phonecall-desktop"
version = "0.1.0"
description = "Poste conseiller : capture audio Windows (WASAPI), transcription en direct et note Phone Call (prototype)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "soxr>=0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "keyring>=25",
  "faster-whisper>=1.1",
  # Note engine (prompt, schema, checks) shared with the gateway: install ../phonecall-agent too
  "anthropic>=1.13",
  "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
  "pywebview>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]
build = ["pyinstaller>=6.6"]

[project.scripts]
phonecall-desktop = "phonecall_desktop.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phonecall_desktop*"]

[tool.setuptools.package-data]
phonecall_desktop = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
